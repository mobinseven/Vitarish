name: vitarish-production

x-runtime: &runtime
  restart: on-failure:5
  security_opt: [no-new-privileges:true]

x-app-runtime: &app-runtime
  <<: *runtime
  read_only: true
  cap_drop: [ALL]
  tmpfs: [/tmp]

x-node-healthcheck: &node-healthcheck
  test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 12

services:
  main:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_MAIN_IMAGE:?VITARISH_PRODUCTION_MAIN_IMAGE is required}"
    env_file:
      - path: ./.env.production.mediatr
        required: false
    expose: [8080]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Vitarish__LandingUrl: https://${VITARISH_PRODUCTION_LANDING_HOST:?VITARISH_PRODUCTION_LANDING_HOST is required}
      Vitarish__PlatformAdminUrl: https://${VITARISH_PRODUCTION_PLATFORM_ADMIN_HOST:?VITARISH_PRODUCTION_PLATFORM_ADMIN_HOST is required}
      # Self-service clinic onboarding (ADR-0016, docs/runbooks/clinic-onboarding.md); the flag alone
      # switches it on and off. The onboarding host is one subdomain under the clinic base domain.
      Vitarish__Features__TenantOnboarding: ${VITARISH_PRODUCTION_TENANT_ONBOARDING:-false}
      Vitarish__TenantBaseDomain: ${VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN:?VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN is required}
      Vitarish__OnboardingUrl: https://${VITARISH_PRODUCTION_ONBOARDING_SUBDOMAIN:?VITARISH_PRODUCTION_ONBOARDING_SUBDOMAIN is required}.${VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN:?VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN is required}
      # The shared sign-in host (ADR-0018): one subdomain under the site domain.
      Vitarish__SignInUrl: https://${VITARISH_PRODUCTION_SIGN_IN_SUBDOMAIN:?VITARISH_PRODUCTION_SIGN_IN_SUBDOMAIN is required}.${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
      Vitarish__Identity__Authority: https://${VITARISH_PRODUCTION_PUBLIC_HOST:?VITARISH_PRODUCTION_PUBLIC_HOST is required}
      Vitarish__Identity__DataProtectionPassword: ${VITARISH_PRODUCTION_DATA_PROTECTION_PASSWORD:?VITARISH_PRODUCTION_DATA_PROTECTION_PASSWORD is required}
      Vitarish__Security__MandatoryAuditEnabled: "true"
      # Temporary, owner-approved: logs sign-in codes. Remove with issue #893.
      Vitarish__Security__DeliveredCodeLog__Enabled: "true"
      Vitarish__Security__Audit__CapacityWarningBytes: ${VITARISH_PRODUCTION_AUDIT_CAPACITY_WARNING_BYTES:?VITARISH_PRODUCTION_AUDIT_CAPACITY_WARNING_BYTES is required}
      Vitarish__Main__AuditCapacityAlert__EmailRecipient: ${VITARISH_PRODUCTION_AUDIT_ALERT_EMAIL:?VITARISH_PRODUCTION_AUDIT_ALERT_EMAIL is required}
      Vitarish__Main__AuditCapacityAlert__SmsRecipient: ${VITARISH_PRODUCTION_AUDIT_ALERT_PHONE:?VITARISH_PRODUCTION_AUDIT_ALERT_PHONE is required}
      Vitarish__Security__Tls__RequireHttps: "true"
      Vitarish__Security__TrustedProxyNetworks__0: ${VITARISH_PRODUCTION_INGRESS_IPV4:?VITARISH_PRODUCTION_INGRESS_IPV4 is required}/32
      Vitarish__Security__TokenValidation__Issuer: https://${VITARISH_PRODUCTION_PUBLIC_HOST:?VITARISH_PRODUCTION_PUBLIC_HOST is required}
      Vitarish__Security__TokenValidation__Audiences__0: vitarish-api
      Vitarish__Security__DataProtection__KeyRingRedisKey: ${VITARISH_PRODUCTION_KEY_RING_NAME:?VITARISH_PRODUCTION_KEY_RING_NAME is required}
      Vitarish__Security__DataProtection__CertificateRedisKey: ${VITARISH_PRODUCTION_CERTIFICATE_KEY_NAME:?VITARISH_PRODUCTION_CERTIFICATE_KEY_NAME is required}
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${VITARISH_PRODUCTION_POSTGRES_DB:?VITARISH_PRODUCTION_POSTGRES_DB is required};Username=${VITARISH_PRODUCTION_POSTGRES_USER:?VITARISH_PRODUCTION_POSTGRES_USER is required};Password=${VITARISH_PRODUCTION_POSTGRES_PASSWORD:?VITARISH_PRODUCTION_POSTGRES_PASSWORD is required}
      ConnectionStrings__Redis: redis:6379,password=${VITARISH_PRODUCTION_REDIS_PASSWORD:?VITARISH_PRODUCTION_REDIS_PASSWORD is required},abortConnect=false
      Vitarish__Files__Endpoint: aistor
      Vitarish__Files__Port: "9000"
      Vitarish__Files__UseSsl: "false"
      Vitarish__Files__AccessKey: ${VITARISH_PRODUCTION_AISTOR_ACCESS_KEY:?VITARISH_PRODUCTION_AISTOR_ACCESS_KEY is required}
      Vitarish__Files__SecretKey: ${VITARISH_PRODUCTION_AISTOR_SECRET_KEY:?VITARISH_PRODUCTION_AISTOR_SECRET_KEY is required}
      Vitarish__Files__BucketName: ${VITARISH_PRODUCTION_AISTOR_BUCKET:?VITARISH_PRODUCTION_AISTOR_BUCKET is required}
      Vitarish__Search__Url: http://elasticsearch:9200
      Vitarish__Search__Username: ${VITARISH_PRODUCTION_ELASTIC_USERNAME:?VITARISH_PRODUCTION_ELASTIC_USERNAME is required}
      Vitarish__Search__Password: ${VITARISH_PRODUCTION_ELASTIC_PASSWORD:?VITARISH_PRODUCTION_ELASTIC_PASSWORD is required}
      Vitarish__Intelligence__OpenAi__ApiKey: ${VITARISH_PRODUCTION_OPENAI_API_KEY:?VITARISH_PRODUCTION_OPENAI_API_KEY is required}
      Vitarish__Intelligence__DefaultResponseModel: ${VITARISH_DEFAULT_RESPONSE_MODEL:?VITARISH_DEFAULT_RESPONSE_MODEL is required}
      Vitarish__Intelligence__AgentRuntime__BaseUrl: http://agent-runtime:3003
      Vitarish__Intelligence__AgentRuntime__Model: openai/gpt-6-luna
      Vitarish__Intelligence__AgentRuntime__ToolCallbackUrl: http://main:8080/api/modules/intelligence/internal/agent/tools/execute
      Vitarish__Intelligence__AgentRuntime__SharedSecret: ${VITARISH_PRODUCTION_AGENT_RUNTIME_SHARED_SECRET:?VITARISH_PRODUCTION_AGENT_RUNTIME_SHARED_SECRET is required}
      Vitarish__Security__AuthenticationAttempts__CurrentPepper: ${VITARISH_PRODUCTION_AUTH_ATTEMPT_KEY_PEPPER:?VITARISH_PRODUCTION_AUTH_ATTEMPT_KEY_PEPPER is required}
      Vitarish__Communications__Providers__SmsDotIr__Key: ${VITARISH_PRODUCTION_SMS_API_KEY:?VITARISH_PRODUCTION_SMS_API_KEY is required}
      Vitarish__Communications__Providers__SmsDotIr__LineNumber: ${VITARISH_PRODUCTION_SMS_LINE_NUMBER:?VITARISH_PRODUCTION_SMS_LINE_NUMBER is required}
      Vitarish__Communications__Providers__SmsDotIr__VerificationCodeTemplateId: ${VITARISH_PRODUCTION_SMS_VERIFICATION_TEMPLATE_ID:?VITARISH_PRODUCTION_SMS_VERIFICATION_TEMPLATE_ID is required}
      Vitarish__Communications__Providers__SmsDotIr__ReminderTemplateId: ${VITARISH_PRODUCTION_SMS_REMINDER_TEMPLATE_ID:?VITARISH_PRODUCTION_SMS_REMINDER_TEMPLATE_ID is required}
      Vitarish__Communications__Providers__Smtp__Host: ${VITARISH_PRODUCTION_SMTP_HOST:?VITARISH_PRODUCTION_SMTP_HOST is required}
      Vitarish__Communications__Providers__Smtp__Port: ${VITARISH_PRODUCTION_SMTP_PORT:?VITARISH_PRODUCTION_SMTP_PORT is required}
      Vitarish__Communications__Providers__Smtp__EnableSsl: "true"
      Vitarish__Communications__Providers__Smtp__Name: ${VITARISH_PRODUCTION_SMTP_NAME:?VITARISH_PRODUCTION_SMTP_NAME is required}
      Vitarish__Communications__Providers__Smtp__Username: ${VITARISH_PRODUCTION_SMTP_USERNAME:?VITARISH_PRODUCTION_SMTP_USERNAME is required}
      Vitarish__Communications__Providers__Smtp__Password: ${VITARISH_PRODUCTION_SMTP_PASSWORD:?VITARISH_PRODUCTION_SMTP_PASSWORD is required}
      Cors__AllowedOrigins__0: https://${VITARISH_PRODUCTION_PUBLIC_HOST:?VITARISH_PRODUCTION_PUBLIC_HOST is required}
      Cors__AllowedOrigins__1: https://${VITARISH_PRODUCTION_PATIENTS_HOST:?VITARISH_PRODUCTION_PATIENTS_HOST is required}
      Cors__AllowedOrigins__2: https://${VITARISH_PRODUCTION_PLATFORM_ADMIN_HOST:?VITARISH_PRODUCTION_PLATFORM_ADMIN_HOST is required}
      Cors__AllowedOrigins__3: https://${VITARISH_PRODUCTION_PM_HOST:?VITARISH_PRODUCTION_PM_HOST is required}
      Cors__AllowedOrigins__4: https://${VITARISH_PRODUCTION_LANDING_HOST:?VITARISH_PRODUCTION_LANDING_HOST is required}
      # Passkeys belong to the site domain so every host under it can use them; clinic hosts are
      # accepted per request through the host's origin trust, not listed here.
      WebAuthn__ServerDomain: ${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
      WebAuthn__Origins__0: https://${VITARISH_PRODUCTION_PUBLIC_HOST:?VITARISH_PRODUCTION_PUBLIC_HOST is required}
      WebAuthn__Origins__1: https://${VITARISH_PRODUCTION_PATIENTS_HOST:?VITARISH_PRODUCTION_PATIENTS_HOST is required}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      aistor: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "test -r /proc/1/cmdline && grep -aq 'Vitarish.Main' /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      application: {}
      egress: {}
      proxy: { aliases: [production-main] }

  private-practice-owner:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_OWNER_WEB_IMAGE:?VITARISH_PRODUCTION_OWNER_WEB_IMAGE is required}"
    environment:
      VITARISH_LOCALE_COOKIE_DOMAIN: ${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
      # The sign-in page links here to create a clinic while the flag is true.
      VITARISH_TENANT_ONBOARDING: ${VITARISH_PRODUCTION_TENANT_ONBOARDING:-false}
      VITARISH_ONBOARDING_URL: https://${VITARISH_PRODUCTION_ONBOARDING_SUBDOMAIN:?VITARISH_PRODUCTION_ONBOARDING_SUBDOMAIN is required}.${VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN:?VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN is required}
      # Sign-in pages on every other host redirect to the shared sign-in host (ADR-0018).
      VITARISH_SIGN_IN_URL: https://${VITARISH_PRODUCTION_SIGN_IN_SUBDOMAIN:?VITARISH_PRODUCTION_SIGN_IN_SUBDOMAIN is required}.${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
    expose: [3000]
    healthcheck: *node-healthcheck
    networks: { application: {}, proxy: { aliases: [production-private-practice-owner] } }
  patients:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_PATIENTS_WEB_IMAGE:?VITARISH_PRODUCTION_PATIENTS_WEB_IMAGE is required}"
    environment:
      VITARISH_LOCALE_COOKIE_DOMAIN: ${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
    expose: [3001]
    healthcheck: *node-healthcheck
    networks: { application: {}, proxy: { aliases: [production-patients] } }
  platform-admin:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_PLATFORM_ADMIN_WEB_IMAGE:?VITARISH_PRODUCTION_PLATFORM_ADMIN_WEB_IMAGE is required}"
    environment:
      VITARISH_LOCALE_COOKIE_DOMAIN: ${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
    expose: [3003]
    healthcheck: *node-healthcheck
    networks: { application: {}, proxy: { aliases: [production-platform-admin] } }
  pm:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_PM_WEB_IMAGE:?VITARISH_PRODUCTION_PM_WEB_IMAGE is required}"
    environment:
      VITARISH_LOCALE_COOKIE_DOMAIN: ${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
    expose: [3004]
    healthcheck: *node-healthcheck
    networks: { application: {}, proxy: { aliases: [production-pm] } }
  landing:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_LANDING_WEB_IMAGE:?VITARISH_PRODUCTION_LANDING_WEB_IMAGE is required}"
    environment:
      VITARISH_LOCALE_COOKIE_DOMAIN: ${VITARISH_PRODUCTION_SITE_DOMAIN:?VITARISH_PRODUCTION_SITE_DOMAIN is required}
      # "Set up my clinic" links here while the flag is true.
      VITARISH_TENANT_ONBOARDING: ${VITARISH_PRODUCTION_TENANT_ONBOARDING:-false}
      VITARISH_ONBOARDING_URL: https://${VITARISH_PRODUCTION_ONBOARDING_SUBDOMAIN:?VITARISH_PRODUCTION_ONBOARDING_SUBDOMAIN is required}.${VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN:?VITARISH_PRODUCTION_CLINIC_BASE_DOMAIN is required}
      # "Chat with us on WhatsApp" opens this number (international digits); empty hides it.
      VITARISH_LANDING_WHATSAPP_NUMBER: ${VITARISH_PRODUCTION_LANDING_WHATSAPP_NUMBER:-}
    expose: [3002]
    healthcheck: *node-healthcheck
    networks: { application: {}, proxy: { aliases: [production-landing] } }
  agent-runtime:
    <<: *app-runtime
    image: "${VITARISH_PRODUCTION_AGENT_RUNTIME_IMAGE:?VITARISH_PRODUCTION_AGENT_RUNTIME_IMAGE is required}"
    expose: [3003]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:' + process.env.PORT + '/api/internal/intelligence-agent/health', { headers: { authorization: 'Bearer ' + process.env.AGENT_RUNTIME_SHARED_SECRET } }).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      # The agent runtime's OpenAI-compatible provider is OpenRouter.
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      OPENAI_API_KEY: ${VITARISH_PRODUCTION_OPENROUTER_API_KEY:?VITARISH_PRODUCTION_OPENROUTER_API_KEY is required}
      AGENT_RUNTIME_SHARED_SECRET: ${VITARISH_PRODUCTION_AGENT_RUNTIME_SHARED_SECRET:?VITARISH_PRODUCTION_AGENT_RUNTIME_SHARED_SECRET is required}
      AGENT_RUNTIME_INTELLIGENCE_HEALTH_URL: http://main:8080/api/modules/clinic/internal/assistant/health
    networks: [application, egress]

  postgres:
    <<: *runtime
    image: "${VITARISH_POSTGRES_IMAGE:?VITARISH_POSTGRES_IMAGE is required}"
    environment:
      POSTGRES_DB: "${VITARISH_PRODUCTION_POSTGRES_DB:?VITARISH_PRODUCTION_POSTGRES_DB is required}"
      POSTGRES_USER: "${VITARISH_PRODUCTION_POSTGRES_USER:?VITARISH_PRODUCTION_POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${VITARISH_PRODUCTION_POSTGRES_PASSWORD:?VITARISH_PRODUCTION_POSTGRES_PASSWORD is required}"
    volumes: [production-postgres:/var/lib/postgresql]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 12 }
    networks: [application]
  redis:
    <<: *runtime
    image: "${VITARISH_REDIS_IMAGE:?VITARISH_REDIS_IMAGE is required}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${VITARISH_PRODUCTION_REDIS_PASSWORD:?VITARISH_PRODUCTION_REDIS_PASSWORD is required}"
    volumes: [production-redis:/data]
    environment:
      REDIS_PASSWORD: "${VITARISH_PRODUCTION_REDIS_PASSWORD:?VITARISH_PRODUCTION_REDIS_PASSWORD is required}"
    healthcheck: { test: [CMD-SHELL, "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"], interval: 10s, timeout: 5s, retries: 12 }
    networks: [application]
  aistor:
    <<: *runtime
    image: "${VITARISH_AISTOR_IMAGE:?VITARISH_AISTOR_IMAGE is required}"
    command: server /mnt/data --license /minio.license
    environment:
      MINIO_ROOT_USER: "${VITARISH_PRODUCTION_AISTOR_ACCESS_KEY:?VITARISH_PRODUCTION_AISTOR_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${VITARISH_PRODUCTION_AISTOR_SECRET_KEY:?VITARISH_PRODUCTION_AISTOR_SECRET_KEY is required}"
    volumes:
      - production-aistor:/mnt/data
      - type: bind
        source: ./minio.license
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    healthcheck: { test: [CMD, mc, ready, local], interval: 5s, timeout: 5s, retries: 12 }
    networks: [application]
  elasticsearch:
    <<: *runtime
    image: "${VITARISH_ELASTICSEARCH_IMAGE:?VITARISH_ELASTICSEARCH_IMAGE is required}"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: "${VITARISH_PRODUCTION_ELASTIC_PASSWORD:?VITARISH_PRODUCTION_ELASTIC_PASSWORD is required}"
    volumes: [production-elasticsearch:/usr/share/elasticsearch/data]
    healthcheck: { test: [CMD-SHELL, "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"], interval: 10s, timeout: 5s, retries: 30 }
    networks: [application]

networks:
  application: { name: vitarish-production-application, internal: true }
  egress: { name: vitarish-production-egress }
  proxy: { name: vitarish-production-proxy, external: true }
volumes:
  production-postgres: { name: vitarish-production-postgres }
  production-redis: { name: vitarish-production-redis }
  production-aistor: { name: vitarish-production-aistor }
  production-elasticsearch: { name: vitarish-production-elasticsearch }
