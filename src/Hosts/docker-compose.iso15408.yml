name: vitarish-iso15408

services:
  main:
    build:
      context: ../..
      dockerfile: src/Hosts/Main/Dockerfile
      args:
        MODULE_BUILD_PROFILE: Evaluated
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      Vitarish__EvaluatedConfiguration__Enabled: "true"
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required},abortConnect=false
      Vitarish__Identity__Authority: ${VITARISH_IDENTITY_AUTHORITY:?VITARISH_IDENTITY_AUTHORITY is required}
      Vitarish__Identity__DataProtectionPassword: ${VITARISH_DATA_PROTECTION_PASSWORD:?VITARISH_DATA_PROTECTION_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [evaluated]

  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - evaluated-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    networks: [evaluated]

  redis:
    image: redis:7.4.5
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - evaluated-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
    networks: [evaluated]

networks:
  evaluated:
    name: vitarish-iso15408

volumes:
  evaluated-postgres:
  evaluated-redis:
