x-bounded-runtime-restart: &bounded-runtime-restart "on-failure:5"

name: vitarish-product-evaluated-v1-0

services:
  caddy:
    image: ${VITARISH_CADDY_IMAGE:?VITARISH_CADDY_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      VITARISH_PUBLIC_HOST: ${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}
      VITARISH_PATIENTS_HOST: ${VITARISH_PATIENTS_HOST:?VITARISH_PATIENTS_HOST is required}
      VITARISH_PLATFORM_ADMIN_HOST: ${VITARISH_PLATFORM_ADMIN_HOST:?VITARISH_PLATFORM_ADMIN_HOST is required}
      VITARISH_PM_HOST: ${VITARISH_PM_HOST:?VITARISH_PM_HOST is required}
      VITARISH_KNOWLEDGE_QA_HOST: ${VITARISH_KNOWLEDGE_QA_HOST:?VITARISH_KNOWLEDGE_QA_HOST is required}
      VITARISH_LANDING_HOST: ${VITARISH_LANDING_HOST:?VITARISH_LANDING_HOST is required}
      VITARISH_TLS_CERT_FILE: /run/secrets/tls_certificate
      VITARISH_TLS_KEY_FILE: /run/secrets/tls_private_key
    volumes:
      - ./caddy/Caddyfile.product-evaluated-v1.0:/etc/caddy/Caddyfile:ro
    secrets:
      - tls_certificate
      - tls_private_key
    depends_on:
      main:
        condition: service_healthy
    networks: [public, application]

  main:
    image: ${VITARISH_MAIN_IMAGE:?VITARISH_MAIN_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [8080]
    environment:
      ASPNETCORE_URLS: http://+:8080
      Vitarish__EvaluatedConfiguration__Enabled: "true"
      Vitarish__EvaluatedConfiguration__Identity: vitarish-product-evaluated-v1.0
      Vitarish__EvaluatedConfiguration__ManifestIdentity: vitarish-product-evaluated-v1.0
      Vitarish__Security__MandatoryAuditEnabled: "true"
      Vitarish__Security__Audit__CapacityWarningBytes: ${VITARISH_AUDIT_CAPACITY_WARNING_BYTES:?VITARISH_AUDIT_CAPACITY_WARNING_BYTES is required}
      Cors__AllowedOrigins__0: https://${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}
      Cors__AllowedOrigins__1: https://${VITARISH_PATIENTS_HOST:?VITARISH_PATIENTS_HOST is required}
      Cors__AllowedOrigins__2: https://${VITARISH_PLATFORM_ADMIN_HOST:?VITARISH_PLATFORM_ADMIN_HOST is required}
      Cors__AllowedOrigins__3: https://${VITARISH_PM_HOST:?VITARISH_PM_HOST is required}
      Cors__AllowedOrigins__4: https://${VITARISH_KNOWLEDGE_QA_HOST:?VITARISH_KNOWLEDGE_QA_HOST is required}
      Cors__AllowedOrigins__5: https://${VITARISH_LANDING_HOST:?VITARISH_LANDING_HOST is required}
      Vitarish__Identity__Authority: ${VITARISH_IDENTITY_AUTHORITY:?VITARISH_IDENTITY_AUTHORITY is required}
      Vitarish__Identity__DataProtectionPassword: ${VITARISH_DATA_PROTECTION_PASSWORD:?VITARISH_DATA_PROTECTION_PASSWORD is required}
      Vitarish__Security__AuthenticationAttempts__CurrentPepper: ${VITARISH_AUTH_ATTEMPT_KEY_PEPPER:?VITARISH_AUTH_ATTEMPT_KEY_PEPPER is required}
      Vitarish__Security__TrustedProxyNetworks__0: ${VITARISH_PROXY_NETWORK:?VITARISH_PROXY_NETWORK is required}
      Vitarish__Security__TokenValidation__Issuer: ${VITARISH_TOKEN_ISSUER:?VITARISH_TOKEN_ISSUER is required}
      Vitarish__Security__TokenValidation__Audiences__0: vitarish-api
      Vitarish__Security__DataProtection__KeyRingRedisKey: ${VITARISH_KEY_RING_NAME:?VITARISH_KEY_RING_NAME is required}
      Vitarish__Security__DataProtection__CertificateRedisKey: ${VITARISH_CERTIFICATE_KEY_NAME:?VITARISH_CERTIFICATE_KEY_NAME is required}
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required},abortConnect=false
      Vitarish__Files__Endpoint: ${VITARISH_FILES_ENDPOINT:?VITARISH_FILES_ENDPOINT is required}
      Vitarish__Files__Port: ${VITARISH_FILES_PORT:?VITARISH_FILES_PORT is required}
      Vitarish__Files__UseSsl: "true"
      Vitarish__Files__AccessKey: ${VITARISH_FILES_ACCESS_KEY:?VITARISH_FILES_ACCESS_KEY is required}
      Vitarish__Files__SecretKey: ${VITARISH_FILES_SECRET_KEY:?VITARISH_FILES_SECRET_KEY is required}
      Vitarish__Files__BucketName: ${VITARISH_FILES_BUCKET_NAME:?VITARISH_FILES_BUCKET_NAME is required}
      Vitarish__Search__Url: ${VITARISH_SEARCH_URL:?VITARISH_SEARCH_URL is required}
      Vitarish__Search__Username: ${VITARISH_SEARCH_USERNAME:?VITARISH_SEARCH_USERNAME is required}
      Vitarish__Search__Password: ${VITARISH_SEARCH_PASSWORD:?VITARISH_SEARCH_PASSWORD is required}
      Vitarish__Communications__Providers__SmsDotIr__Key: ${VITARISH_SMS_API_KEY:?VITARISH_SMS_API_KEY is required}
      Vitarish__Communications__Providers__SmsDotIr__LineNumber: ${VITARISH_SMS_LINE_NUMBER:?VITARISH_SMS_LINE_NUMBER is required}
      Vitarish__Communications__Providers__SmsDotIr__VerificationCodeTemplateId: ${VITARISH_SMS_VERIFICATION_TEMPLATE_ID:?VITARISH_SMS_VERIFICATION_TEMPLATE_ID is required}
      Vitarish__Communications__Providers__SmsDotIr__ReminderTemplateId: ${VITARISH_SMS_REMINDER_TEMPLATE_ID:?VITARISH_SMS_REMINDER_TEMPLATE_ID is required}
      Vitarish__Communications__Providers__Smtp__Host: ${VITARISH_SMTP_HOST:?VITARISH_SMTP_HOST is required}
      Vitarish__Communications__Providers__Smtp__Port: ${VITARISH_SMTP_PORT:?VITARISH_SMTP_PORT is required}
      Vitarish__Communications__Providers__Smtp__EnableSsl: "true"
      Vitarish__Communications__Providers__Smtp__Name: ${VITARISH_SMTP_NAME:?VITARISH_SMTP_NAME is required}
      Vitarish__Communications__Providers__Smtp__Username: ${VITARISH_SMTP_USERNAME:?VITARISH_SMTP_USERNAME is required}
      Vitarish__Communications__Providers__Smtp__Password: ${VITARISH_SMTP_PASSWORD:?VITARISH_SMTP_PASSWORD is required}
      Vitarish__Intelligence__OpenAi__ApiKey: ${VITARISH_OPENAI_API_KEY:?VITARISH_OPENAI_API_KEY is required}
      Vitarish__Intelligence__AgentRuntime__BaseUrl: http://agent-runtime:3003
      Vitarish__Intelligence__AgentRuntime__ToolCallbackUrl: http://main:8080/api/modules/intelligence/internal/agent/tools/execute
      Vitarish__Intelligence__AgentRuntime__SharedSecret: ${VITARISH_AGENT_RUNTIME_SHARED_SECRET:?VITARISH_AGENT_RUNTIME_SHARED_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/cmdline && grep -aq 'Vitarish.Main' /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [application, egress]

  web-private-practice-owner:
    image: ${VITARISH_OWNER_WEB_IMAGE:?VITARISH_OWNER_WEB_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3000]
    environment:
      VITARISH_API_ORIGIN: https://${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}
    depends_on:
      caddy:
        condition: service_started
    networks: [application]

  web-patients:
    image: ${VITARISH_PATIENTS_WEB_IMAGE:?VITARISH_PATIENTS_WEB_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3000]
    environment: { VITARISH_API_ORIGIN: "https://${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}" }
    networks: [application]

  web-platform-admin:
    image: ${VITARISH_PLATFORM_ADMIN_WEB_IMAGE:?VITARISH_PLATFORM_ADMIN_WEB_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3003]
    environment: { VITARISH_API_ORIGIN: "https://${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}" }
    networks: [application]

  web-vitarish-pm:
    image: ${VITARISH_PM_WEB_IMAGE:?VITARISH_PM_WEB_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3004]
    environment: { VITARISH_API_ORIGIN: "https://${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}" }
    networks: [application]

  web-knowledge-qa-demo:
    image: ${VITARISH_KNOWLEDGE_QA_WEB_IMAGE:?VITARISH_KNOWLEDGE_QA_WEB_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3001]
    environment: { VITARISH_API_ORIGIN: "https://${VITARISH_PUBLIC_HOST:?VITARISH_PUBLIC_HOST is required}" }
    networks: [application]

  web-vitarish-landing:
    image: ${VITARISH_LANDING_WEB_IMAGE:?VITARISH_LANDING_WEB_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3002]
    networks: [application]

  agent-runtime:
    image: ${VITARISH_AGENT_RUNTIME_IMAGE:?VITARISH_AGENT_RUNTIME_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: [3003]
    environment:
      AGENT_RUNTIME_SHARED_SECRET: ${VITARISH_AGENT_RUNTIME_SHARED_SECRET:?VITARISH_AGENT_RUNTIME_SHARED_SECRET is required}
    networks: [application]

  postgres:
    image: ${VITARISH_POSTGRES_IMAGE:?VITARISH_POSTGRES_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [product-evaluated-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [application]

  redis:
    image: ${VITARISH_REDIS_IMAGE:?VITARISH_REDIS_IMAGE must be a versioned image reference}
    restart: *bounded-runtime-restart
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes: [product-evaluated-redis:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [application]

networks:
  public:
  application:
    internal: true
  egress:

volumes:
  product-evaluated-postgres:
  product-evaluated-redis:

secrets:
  tls_certificate:
    file: ${VITARISH_TLS_CERT_FILE:?VITARISH_TLS_CERT_FILE is required}
  tls_private_key:
    file: ${VITARISH_TLS_KEY_FILE:?VITARISH_TLS_KEY_FILE is required}
