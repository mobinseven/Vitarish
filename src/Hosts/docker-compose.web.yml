# Runs the Next.js Web UI alongside the .NET Main host.
# Usage: docker compose -f src/Hosts/docker-compose.web.yml up --build

services:
  web:
    build:
      context: ./Web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - main

  project-management:
    build:
      context: ./Web
      dockerfile: apps/vitarish-pm/Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
      secrets:
        - source: heroui_auth_token
          target: HEROUI_AUTH_TOKEN
    ports:
      - "3004:3004"
    depends_on:
      - main

  agent-runtime:
    build:
      context: ./Web
      dockerfile: apps/agent-runtime/Dockerfile
    ports:
      - "3003:3003"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      AGENT_RUNTIME_SHARED_SECRET: ${VITARISH_AGENT_RUNTIME_SECRET}
      AGENT_RUNTIME_INTELLIGENCE_HEALTH_URL: http://main:8080/api/modules/clinic/internal/agent/health
    depends_on:
      - main

  main:
    build:
      context: ../..
      dockerfile: src/Hosts/Main/Dockerfile
    ports:
      - "5000:8080"
    environment:
      Vitarish__Intelligence__AgentRuntime__BaseUrl: http://agent-runtime:3003
      Vitarish__Intelligence__AgentRuntime__ToolCallbackUrl: http://main:8080/api/modules/intelligence/internal/agent/tools/execute
      Vitarish__Intelligence__AgentRuntime__SharedSecret: ${VITARISH_AGENT_RUNTIME_SECRET}
      Cors__AllowedOrigins__0: http://localhost:3000
      Cors__AllowedOrigins__1: http://localhost:3004

secrets:
  heroui_auth_token:
    environment: HEROUI_AUTH_TOKEN
