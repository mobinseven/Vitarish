# Runs the Next.js Web UI alongside the .NET Main host.
# Usage: docker compose -f src/Hosts/docker-compose.web.yml up --build

services:
  web:
    build:
      context: ./Web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - main

  main:
    build:
      context: ../..
      dockerfile: src/Hosts/Main/Dockerfile
    ports:
      - "5000:8080"
