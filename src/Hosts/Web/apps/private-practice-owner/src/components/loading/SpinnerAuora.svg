<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- SMIL animateTransform (not CSS @keyframes), so it animates on its own with
       no dependency on transform-box support or on inline <style> making it past a CSP. -->
  <defs>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8FC9" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF8FC9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5C86FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5C86FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B98CFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B98CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobLilac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC2EC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFC2EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFA65C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFA65C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FE0D8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4FE0D8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD5C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFDD5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphereFace" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="auroraBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="edgeSoften" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <g filter="url(#auroraBlur)">
    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; 28,-20; -16,24; -32,-8; 10,18; 0,0"
        keyTimes="0;0.21;0.46;0.69;0.87;1" dur="5.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 118 118; 78 118 118; 151 118 118; 238 118 118; 312 118 118; 360 118 118"
        keyTimes="0;0.21;0.46;0.69;0.87;1" dur="5.5s" repeatCount="indefinite"/>
      <circle cx="118" cy="118" r="98" fill="url(#blobPink)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; -26,16; 20,30; 30,-22; -18,-26; 0,0"
        keyTimes="0;0.17;0.39;0.64;0.83;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 206 196; -52 206 196; -133 206 196; -217 206 196; -296 206 196; -360 206 196"
        keyTimes="0;0.17;0.39;0.64;0.83;1" dur="7s" repeatCount="indefinite"/>
      <circle cx="206" cy="196" r="102" fill="url(#blobBlue)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; 22,26; -28,-6; 8,-28; 0,0"
        keyTimes="0;0.24;0.52;0.76;1" dur="4.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 150 208; 101 150 208; 196 150 208; 287 150 208; 360 150 208"
        keyTimes="0;0.24;0.52;0.76;1" dur="4.5s" repeatCount="indefinite"/>
      <circle cx="150" cy="208" r="82" fill="url(#blobPurple)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; -20,-24; 24,12; 6,28; 0,0"
        keyTimes="0;0.29;0.54;0.77;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 192 108; -84 192 108; -176 192 108; -265 192 108; -360 192 108"
        keyTimes="0;0.29;0.54;0.77;1" dur="8s" repeatCount="indefinite"/>
      <circle cx="192" cy="108" r="72" fill="url(#blobLilac)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; -24,22; 18,-26; -30,-10; 12,16; 0,0"
        keyTimes="0;0.19;0.43;0.66;0.88;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 90 200; -66 90 200; -145 90 200; -228 90 200; -305 90 200; -360 90 200"
        keyTimes="0;0.19;0.43;0.66;0.88;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="90" cy="200" r="80" fill="url(#blobOrange)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; 20,20; -22,10; 14,-24; -12,14; 0,0"
        keyTimes="0;0.2;0.42;0.63;0.85;1" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 230 110; 84 230 110; 162 230 110; 249 230 110; 318 230 110; 360 230 110"
        keyTimes="0;0.2;0.42;0.63;0.85;1" dur="5s" repeatCount="indefinite"/>
      <circle cx="230" cy="110" r="75" fill="url(#blobTeal)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" calcMode="linear"
        values="0,0; -18,18; 26,8; -8,-24; 16,-6; 0,0"
        keyTimes="0;0.22;0.45;0.68;0.86;1" dur="6.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" calcMode="linear"
        values="0 160 60; -72 160 60; -158 160 60; -241 160 60; -313 160 60; -360 160 60"
        keyTimes="0;0.22;0.45;0.68;0.86;1" dur="6.5s" repeatCount="indefinite"/>
      <circle cx="160" cy="60" r="70" fill="url(#blobYellow)"/>
    </g>
  </g>

  <g filter="url(#edgeSoften)">
    <circle cx="160" cy="160" r="118" fill="url(#sphereFace)"/>
    <circle cx="160" cy="160" r="118" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  </g>
</svg>