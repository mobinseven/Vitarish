name: vitarish
services:

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server --address ":7010" --console-address ":7011" /data
    ports:
      - "7010:7010"   # S3 API
      - "7011:7011"   # Web console
    env_file: [ ./minio.env ]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7010/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [appnet]


  elasticsearch:
    image: elasticsearch:9.3.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks: [appnet]
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--requirepass","01b9337b8b8a4cd8bbce16b55f604753"]
    networks: [appnet]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pg
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: changeme
    networks: [appnet]
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pg"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: homeall/caddy-reverse-proxy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    environment:
      - CADDY_INGRESS_NETWORKS=appnet
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp" # HTTP/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-data:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
    networks: [appnet]

networks:
  appnet:
    name: appnet
    external: true

volumes:
  redis-data:
    name: redis-data
    external: true
  caddy-data:
    name: caddy-data
  minio-data:
    name: minio-data
  esdata:
    name: esdata
    external: true
  pg-data:
    name: pg-data


