name: vitarish
services:

  aistor:
    image: ${VITARISH_AISTOR_IMAGE:?VITARISH_AISTOR_IMAGE is required}
    container_name: aistor
    command: [server, --address, ":7010", --console-address, ":7011", /data, --license, /minio.license]
    environment:
      MINIO_ROOT_USER: ${VITARISH_TEST_AISTOR_ACCESS_KEY:?VITARISH_TEST_AISTOR_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${VITARISH_TEST_AISTOR_SECRET_KEY:?VITARISH_TEST_AISTOR_SECRET_KEY is required}
    ports:
      - "7010:7010"   # S3 API
      - "7011:7011"   # Web console
    volumes:
      - aistor-data:/data
      - type: bind
        source: ./deployment/minio.license
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [appnet]


  elasticsearch:
    image: elasticsearch:9.3.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=changeme
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks: [appnet]
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    networks: [appnet]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pg
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: changeme
    networks: [appnet]
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pg"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: homeall/caddy-reverse-proxy-cloudflare:latest
    container_name: caddy
    restart: unless-stopped
    environment:
      - CADDY_INGRESS_NETWORKS=appnet
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp" # HTTP/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy-data:/data
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
    networks: [appnet]

networks:
  appnet:
    name: appnet
    external: true

volumes:
  redis-data:
    name: redis-data
    external: true
  caddy-data:
    name: caddy-data
  aistor-data:
    name: aistor-data
  esdata:
    name: esdata
    external: true
  pg-data:
    name: pg-data

