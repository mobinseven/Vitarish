name: platform-user-journey-curator
version: 0.1.0
description: Curates user journey maps for design objectives and derives implementation artifacts from them.
entrypoint: SKILL.md
recommended_paths:
  - docs/product/journeys/
  - docs/architecture/decisions/
  - src/
capabilities:
  - journey_mapping
  - product_discovery
  - implementation_derivation
  - journey_fit_review
  - documentation_maintenance
inputs:
  - design objective
  - existing journey map
  - code review observations
  - product requirements
  - PR diff
outputs:
  - user journey map
  - journey-derived implementation plan
  - feature slices
  - acceptance criteria
  - metrics
  - journey fit review
guardrails:
  - Do not skip journey mapping before implementation planning.
  - Do not invent evidence without marking assumptions.
  - Do not treat technical implementation as the user journey.
  - Recommend ADR review when the derived work changes architecture.
