name: Loop Controller

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  control:
    name: Manage implementation loops
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check loop states
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const glob = require('glob');

            // Find all loop state files
            const stateFiles = glob.sync('.mimocode/loop-state.json');

            for (const stateFile of stateFiles) {
              const state = JSON.parse(fs.readFileSync(stateFile));

              // Check for stuck states
              const lastUpdate = new Date(state.updated_at);
              const hoursSinceUpdate = (Date.now() - lastUpdate.getTime()) / (1000 * 60 * 60);

              if (hoursSinceUpdate > 24 && state.status !== 'completed') {
                // Stuck state - escalate
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: state.issue_number,
                  body: `## Implementation Stuck

The implementation has been in status \`${state.status}\` for over 24 hours.

Please review and provide guidance.`
                });

                // Add stuck label
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: state.issue_number,
                  labels: ['status: stuck']
                });
              }

              // Check for max iterations exceeded
              if (state.iteration >= state.max_iterations && state.status !== 'completed') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: state.issue_number,
                  body: `## Max Iterations Reached

The implementation has reached the maximum iteration limit (${state.max_iterations}).

Status: ${state.status}
Iterations: ${state.iteration}

Please review the implementation manually.`
                });

                state.status = 'escalated';
                state.updated_at = new Date().toISOString();
                fs.writeFileSync(stateFile, JSON.stringify(state, null, 2));
              }
            }