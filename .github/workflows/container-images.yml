name: Container images

on:
  push:
    branches: [main, 'release/**']
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/vitarish

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: caddy
            context: src/Hosts/deployment
            file: Dockerfile
            requires_token: false
          - name: main
            context: .
            file: src/Hosts/Main/Dockerfile
            requires_token: false
          - name: agent-runtime
            context: src/Hosts/Web
            file: apps/agent-runtime/Dockerfile
            requires_token: false
          - name: private-practice-owner
            context: src/Hosts/Web
            file: apps/private-practice-owner/Dockerfile
            requires_token: true
          - name: patients
            context: src/Hosts/Web
            file: apps/patients/Dockerfile
            requires_token: true
          - name: platform-admin
            context: src/Hosts/Web
            file: apps/platform-admin/Dockerfile
            requires_token: true
          - name: pm
            context: src/Hosts/Web
            file: apps/vitarish-pm/Dockerfile
            requires_token: true
          - name: knowledge-qa
            context: src/Hosts/Web
            file: apps/knowledge-qa-demo/Dockerfile
            requires_token: true
          - name: landing
            context: src/Hosts/Web
            file: apps/vitarish-landing/Dockerfile
            requires_token: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context == '.' && matrix.file || format('{0}/{1}', matrix.context, matrix.file) }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}:${{ github.sha }}
          provenance: true
          build-args: ${{ matrix.requires_token && 'NEXT_PUBLIC_API_BASE_URL=' || '' }}
          secret-envs: ${{ matrix.requires_token && 'HEROUI_AUTH_TOKEN=HEROUI_AUTH_TOKEN' || '' }}
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

  release-manifest:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable image digests
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-images-${GITHUB_SHA}.env"
          : > "$manifest"
          declare -A names=(
            [main]=MAIN_IMAGE
            [agent-runtime]=AGENT_RUNTIME_IMAGE
            [private-practice-owner]=OWNER_WEB_IMAGE
            [patients]=PATIENTS_WEB_IMAGE
            [platform-admin]=PLATFORM_ADMIN_WEB_IMAGE
            [pm]=PM_WEB_IMAGE
            [knowledge-qa]=KNOWLEDGE_QA_WEB_IMAGE
            [landing]=LANDING_WEB_IMAGE
          )
          caddy_reference="${REGISTRY}/${IMAGE_NAMESPACE}/caddy:${GITHUB_SHA}"
          caddy_digest="$(docker buildx imagetools inspect "$caddy_reference" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$caddy_digest"
          printf 'VITARISH_CADDY_IMAGE=%s@%s\n' "$REGISTRY/$IMAGE_NAMESPACE/caddy" "$caddy_digest" >> "$manifest"
          for image in main agent-runtime private-practice-owner patients platform-admin pm knowledge-qa landing; do
            reference="${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            test -n "$digest"
            for environment in TEST PRODUCTION; do
              printf 'VITARISH_%s_%s=%s@%s\n' "$environment" "${names[$image]}" "$REGISTRY/$IMAGE_NAMESPACE/$image" "$digest" >> "$manifest"
            done
          done
          aistor_reference="quay.io/minio/aistor/minio:latest"
          aistor_digest="$(docker buildx imagetools inspect "$aistor_reference" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$aistor_digest"
          printf 'VITARISH_POSTGRES_IMAGE=postgres:18.0\nVITARISH_REDIS_IMAGE=redis:7.4.5\n' >> "$manifest"
          printf 'VITARISH_AISTOR_IMAGE=quay.io/minio/aistor/minio@%s\n' "$aistor_digest" >> "$manifest"
          printf 'VITARISH_ELASTICSEARCH_IMAGE=elasticsearch:9.3.4\n' >> "$manifest"
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-manifest-${{ github.sha }}
          path: release-images-${{ github.sha }}.env
          if-no-files-found: error
