name: Web Host

on:
  push:
    paths:
      - "src/Hosts/Web/**"
      - ".agents/skills/**"
      - ".github/workflows/web.yml"
      - "AGENTS.md"
      - "docs/codebase-map.md"
  pull_request:
    paths:
      - "src/Hosts/Web/**"
      - ".agents/skills/**"
      - ".github/workflows/web.yml"
      - "AGENTS.md"
      - "docs/codebase-map.md"

permissions:
  contents: read

env:
  HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

jobs:
  layout:
    name: Layout validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosts/Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Hosts/Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate layout policy
        run: npm run lint:layout
      - name: Test layout policy validator
        run: npm run test:layout-lint

  quality:
    name: Contracts and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosts/Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Hosts/Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate API client
        run: npm run generate:api --workspaces --if-present
      - name: Typecheck
        run: npm run typecheck
      - name: Validate Web UI boundary
        run: npm run validate:web-ui-boundary
      - name: Validate app boundaries
        run: npm run validate:app-boundaries
      - name: Validate app docs
        run: npm run validate:docs:app-boundaries
      - name: Validate API boundary
        run: npm run validate:api-boundary
      - name: Validate localization
        run: npm run validate:localization

  tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosts/Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Hosts/Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate API client
        run: npm run generate:api --workspaces --if-present
      - name: Test
        run: npm run test

  builds:
    name: Application builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Hosts/Web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Hosts/Web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate API client
        run: npm run generate:api --workspaces --if-present
      - name: Lint private practice owner
        run: npm run lint --workspace @vitarish/private-practice-owner
      - name: Build private practice app
        run: npm run build:private-practice-owner
      - name: Build Knowledge QA demo
        run: npm run build:knowledge-qa-demo
      - name: Build Project Management app
        run: npm run build:vitarish-pm
      - name: Build Vitarish landing app
        run: npm run build:vitarish-landing

  aggregate:
    name: Build & Typecheck
    if: ${{ always() }}
    needs: [layout, quality, tests, builds]
    runs-on: ubuntu-latest
    steps:
      - name: Verify parallel Web checks
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Web checks passed
        run: echo "All parallel Web checks passed."
