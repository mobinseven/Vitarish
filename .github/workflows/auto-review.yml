name: Auto Review Implementation

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review implementation
    runs-on: ubuntu-latest

    if: >
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-generated')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/auto-review'))

    env:
      MIMO_MODEL: mimo-auto
      MAX_REVIEW_CHARS: 100000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine PR number
        id: pr
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else {
              prNumber = context.payload.issue?.number;
            }
            core.setOutput('pr_number', prNumber);

      - name: Review implementation
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PR_BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const state = JSON.parse(fs.readFileSync('.mimocode/loop-state.json'));

            function generateReplanPlan(state, feedback) {
              return [
                `# Replan Plan`,
                '',
                `**Issue**: #${state.issue_number}`,
                `**Iteration**: ${state.iteration + 1}`,
                `**Previous feedback**:`,
                '',
                feedback || 'No feedback provided',
                '',
                '## Objective',
                '',
                'Address review feedback and re-implement.',
                '',
                '## Phases',
                '',
                '### Phase 1: Address Feedback',
                '',
                'Fix all issues identified in the review.',
                '',
                '### Phase 2: Verification',
                '',
                'Re-verify against architecture rules.'
              ].join('\n');
            }

            const reviewFeedback = state.review_feedback || 'Address all review findings';

            // Generate new plan based on review feedback
            const newPlan = generateReplanPlan(state, reviewFeedback);

            // Write new plan file
            const timestamp = Date.now();
            const adjectives = ['swift', 'bright', 'clear', 'deep', 'eager'];
            const nouns = ['river', 'stone', 'wind', 'flame', 'wave'];
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            const filename = `${timestamp}-${adj}-${noun}.md`;

            fs.writeFileSync(`.mimocode/plans/${filename}`, newPlan);

            // Update loop state
            state.iteration += 1;
            state.status = 'replan_generated';
            state.plan_file = filename;
            state.review_feedback = reviewFeedback;
            state.updated_at = new Date().toISOString();
            fs.writeFileSync('.mimocode/loop-state.json', JSON.stringify(state, null, 2));

            // Commit new plan
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add .mimocode/');
            execSync('git commit -m "chore: generate replan from review feedback"');
            execSync('git push');

      - name: Handle approved
        if: steps.review.outputs.verdict == 'approved'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.PR_BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const state = JSON.parse(fs.readFileSync('.mimocode/loop-state.json'));

            // Mark as completed
            state.status = 'completed';
            state.completed_at = new Date().toISOString();
            state.updated_at = new Date().toISOString();
            fs.writeFileSync('.mimocode/loop-state.json', JSON.stringify(state, null, 2));

            // Delete plan file
            if (state.plan_file) {
              fs.unlinkSync(`.mimocode/plans/${state.plan_file}`);
            }

            // Comment on issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: state.issue_number,
              body: [
                '## Implementation Complete',
                '',
                `The implementation has been approved after ${state.iteration} iteration(s).`,
                '',
                `PR: #${state.pr_number}`,
                'Status: Approved',
                '',
                'The plan file has been cleaned up. The implementation is complete.'
              ].join('\n')
            });

            // Add completion label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: state.issue_number,
              labels: ['status: completed']
            });

            // Commit cleanup
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add .mimocode/');
            execSync('git commit -m "chore: complete implementation loop"');
            execSync('git push');