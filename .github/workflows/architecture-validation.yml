name: Architecture Validation

on:
  pull_request:
    paths:
      - "**/Modules/**/*.csproj"
  push:
    branches:
      - main
    paths:
      - "**/Modules/**/*.csproj"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface-boundaries:
    name: Validate ADR-0003 layer boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate ADR-0003 layer boundaries
        run: python3 tools/architecture/validate_interface_boundaries.py

      - name: Validate ADR-004 protected module APIs
        if: ${{ always() }}
        run: python3 tools/architecture/validate_module_api_boundaries.py
