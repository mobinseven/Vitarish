name: Architecture Validation

on:
  pull_request:
    paths:
      - "src/Hosts/Main/**"
      - "src/Modules/**"
      - "src/Apps/**"
      - "tools/architecture/**"
      - "docs/architecture/**"
      - "docs/platform/modules/platform/decisions/**"
  push:
    branches:
      - main
    paths:
      - "src/Hosts/Main/**"
      - "src/Modules/**"
      - "src/Apps/**"
      - "tools/architecture/**"
      - "docs/architecture/**"
      - "docs/platform/modules/platform/decisions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-blazor:
    name: Validate ADR-0009 no-Blazor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate no Blazor/Razor or Interface projects
        run: python3 tools/architecture/validate_no_blazor.py

      - name: Validate ADR-0004 protected module APIs
        if: ${{ always() }}
        run: python3 tools/architecture/validate_module_api_boundaries.py

      - name: Validate OpenAPI endpoint coverage
        if: ${{ always() }}
        run: python3 tools/architecture/validate_openapi_endpoint_coverage.py
