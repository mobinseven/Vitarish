# .codex/config.toml

[mcp_servers.heroui-pro]
url = "https://mcp.heroui.pro/mcp"
env_http_headers = { "x-heroui-personal-token" = "HEROUI_PERSONAL_TOKEN" }
required = false
tool_timeout_sec = 60

[mcp_servers.heroui-pro.tools.get_component_docs]
approval_mode = "approve"

[mcp_servers.heroui-react]
command = "npx"
args = ["-y", "@heroui/react-mcp@latest"]

[mcp_servers.heroui-react.tools.list_components]
approval_mode = "approve"
